services:
  dark-bay:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://dark-bay-owner:dark-bay-password@db:5432/postgres
      - BETTER_AUTH_SECRET=supersecretkey12345678901234567890
      - BETTER_AUTH_URL=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: dark-bay-owner
      POSTGRES_PASSWORD: dark-bay-password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dark-bay-owner -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
